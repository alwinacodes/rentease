<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentEase | Find Rooms for Rent in Nepal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">Rent<span>Ease</span></div>
    <nav>
      <a href="#listings">Browse</a>
      <a href="#">Bill Calculator</a>
      <a href="#">For Landlords</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Find a place that fits your life and budget</h1>
    <p>Rooms, flats and shops across Bhaktapur, Lalitpur and Kathmandu. Pay only for the water and electricity you use.</p>

    <form class="search-box" id="search-form">
  <select id="area">
    <option value="">Any area</option>
    <option value="Bhaktapur">Bhaktapur</option>
    <option value="Lalitpur">Lalitpur</option>
    <option value="Kathmandu">Kathmandu</option>
  </select>
  <select id="type">
    <option value="">Any property type</option>
    <option value="Apartment flat">Apartment flat</option>
    <option value="Entire house">Entire house</option>
    <option value="Single room">Single room</option>
    <option value="Shop / shutter">Shop / shutter</option>
  </select>
  <select id="stay">
    <option value="">Any stay</option>
    <option value="Temporary">Temporary</option>
    <option value="Permanent">Permanent</option>
  </select>
  <input type="number" id="min" placeholder="Min Rs">
  <input type="number" id="max" placeholder="Max Rs">
  <button type="submit">Search</button>
</form>
  </section>

  <section class="listings" id="listings">
  <h2>Available Properties</h2>
  <p id="result-count"></p>
  <div class="card-grid" id="card-grid"></div>
</section>

  <footer>
    <p>&copy; 2026 RentEase. Built for Nepal's renters and landlords.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
